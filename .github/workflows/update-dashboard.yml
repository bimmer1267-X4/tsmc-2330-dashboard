name: Update Dashboard Data

on:
  schedule:
    # 週一至週五 22:00 UTC (台北時間隔日 06:00)，在台股與美股 ADR 皆已收盤後執行
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch TWSE daily data + technical indicators
        run: node scripts/update-dashboard.mjs

      - name: Merge ADR/FX + classify valuation zone
        run: node scripts/merge-and-classify.mjs

      - name: Build dashboard.html
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated daily data update"
            git push
          fi

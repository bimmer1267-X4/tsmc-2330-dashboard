name: Update Dashboard Data

on:
  schedule:
    # 週一至週五 22:00 UTC (台北時間隔日 06:00)，在台股與美股 ADR 皆已收盤後執行
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ONE-TIME 回填台指期夜盤歷史OHLC(用完即刪)
        run: node scripts/backfill-taifex-night-ohlc.mjs
        continue-on-error: true

      - name: Fetch TWSE daily data + technical indicators
        run: node scripts/update-dashboard.mjs

      # 這個step要排在merge-and-classify.mjs之前：merge-and-classify.mjs的開盤價機率預估
      # 四變數模型要用「今天」的d.taifexNightClose(TX夜盤變動%)當即時輸入，這裡先跑完
      # 才能確保讀到的是今天剛更新的值，不是還沒更新的昨天舊值。
      - name: Fetch margin trading / SOX+TAIEX / ex-dividend / options open interest
        run: node scripts/fetch-market-context.mjs

      - name: Merge ADR/FX + classify valuation zone
        run: node scripts/merge-and-classify.mjs

      - name: Build dashboard.html
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/adr-premium-history.json data/prediction-accuracy-history.json data/taifex-night-history.json dashboard.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated daily data update"
            git push
          fi

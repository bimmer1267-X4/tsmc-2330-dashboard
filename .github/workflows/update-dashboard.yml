name: Update Dashboard Data

on:
  schedule:
    # 週一至週五 22:00 UTC (台北時間隔日 06:00)，在台股與美股 ADR 皆已收盤後執行
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch TWSE daily data + technical indicators
        run: node scripts/update-dashboard.mjs

      # 這個step要排在merge-and-classify.mjs之前：merge-and-classify.mjs的開盤價機率預估
      # 四變數模型要用「今天」的d.taifexNightClose(TX夜盤變動%)當即時輸入，這裡先跑完
      # 才能確保讀到的是今天剛更新的值，不是還沒更新的昨天舊值。
      - name: Fetch margin trading / SOX+TAIEX / ex-dividend / options open interest
        run: node scripts/fetch-market-context.mjs

      # 「盤前股價預測」「ADR歷史相近價位類比估計」這兩張卡片的意義是「用隔夜資訊，預測
      # 當天開盤缺口」，06:00排程跑完之後當天的預測就該定案，不該因為使用者手動補跑
      # renew-2330（例如排程失敗、想手動補跑）而再變動——重算用的訓練樣本、即時ADR/匯率
      # 報價都會因為時間點不同而有微幅差異，導致「已經發生過的當天開盤」的預測數字看起來
      # 莫名其妙地變動，容易讓人誤會。
      #
      # 只限制手動觸發(workflow_dispatch)，排程本身(schedule)永遠跑完整模式——06:00排程
      # 就是唯一真正該重算這兩張卡片的時間點，不受這個時間窗限制。鎖定時間窗訂在當天13:30
      # (台股收盤)～隔日08:00(06:00排程理論上已經跑完)：這段期間內手動觸發，改用已經存在
      # 的--backfill-only模式(post-close-update.yml本來就在用)，只回填收盤價相關資料跟
      # 準確度追蹤，完全不碰d.openPrediction/d.adrAnalogMatches。
      - name: Merge ADR/FX + classify valuation zone
        run: |
          HOURMIN=$((10#$(TZ=Asia/Taipei date +%H%M)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ "$HOURMIN" -ge 1330 ] || [ "$HOURMIN" -lt 800 ]; }; then
            echo "手動觸發且落在鎖定時間窗(13:30~隔日08:00)內，只回填收盤價相關資料，不重算盤前預測/ADR類比估計"
            node scripts/merge-and-classify.mjs --backfill-only
          else
            node scripts/merge-and-classify.mjs
          fi

      - name: Build dashboard.html
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/adr-premium-history.json data/prediction-accuracy-history.json data/taifex-night-history.json dashboard.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated daily data update"
            git push
          fi

name: Debug Taifex Night Close (temporary)

# 暫時性診斷workflow(第二輪)：查核台指期夜盤收盤價抓取異常，改用延伸到未來日期
# (2026/08/10)的查詢區間，驗證TAIFEX官方是否真的把「開盤8/7 15:00、收盤8/8 05:00」
# 這場夜盤標示成交易日期2026/08/10。只能手動觸發，不會自動排程執行，也不會
# commit/push任何東西，純粹跑scripts/debug-taifex-night.mjs把診斷資訊印到log裡。
# 診斷完成確認根因後會跟scripts/debug-taifex-night.mjs一起移除。
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run diagnostic
        run: node scripts/debug-taifex-night.mjs

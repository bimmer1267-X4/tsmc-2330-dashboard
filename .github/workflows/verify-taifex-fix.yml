name: Verify Taifex Fix (temporary)

# 暫時性驗證workflow：驗證scripts/fetch-market-context.mjs修正1(queryEndDate往未來多推
# 10天)是否真的能抓到TAIFEX最新一場盤後資料、跟舊查詢範圍抓到的結果是否不同。只能手動
# 觸發，不會自動排程執行，也不會commit/push任何東西，純粹跑scripts/verify-taifex-fix.mjs
# 把診斷資訊印到log裡。驗證完成後會跟scripts/verify-taifex-fix.mjs一起移除。
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run verification
        run: node scripts/verify-taifex-fix.mjs

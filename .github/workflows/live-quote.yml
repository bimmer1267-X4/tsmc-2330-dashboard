name: Live Quote Update

on:
  schedule:
    # 交易日台北時間 09:02-13:57 (01:02-05:57 UTC)，每5分鐘一次。
    # 刻意錯開2分鐘、不排在整點/5分鐘整數點：GitHub Actions排程在這些
    # 「整數時間點」負載最高，最容易被延遲或直接跳過，錯開後可以避開尖峰。
    - cron: "2-57/5 1-5 * * 1-5"
    # 交易日台北時間 14:02 (06:02 UTC) 收盤前最後補一次
    - cron: "2 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live quote
        run: node scripts/fetch-live-quote.mjs

      - name: Build dashboard.html
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json dashboard.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: live quote update"
            git push
          fi
